id: btno
name: Bergens Tidende
language: "no"
url: https://www.bt.no/
domains:
  - bt.no

strategies:
  - type: link_scan
    href_must:
      - "/i/[A-Za-z0-9]+/"
    href_skip:
      - "doedsannonser"
      - "dagens-hjernetrim"
      - "nyheter-direkte"
      - "/direkte/"
      - "/login"
      - "/restaurantguide"
      - "/bedriftsroboten"
      - "/bergen-aapner"
    min_length: 18
    title:
      - { from: self, select: "h2, h3", score: 9 }
      - { from: self, recipe: text, score: 6 }
