id: dn
name: Dagens Nyheter
language: sv
url: https://www.dn.se/
domains:
  - dn.se

strategies:
  - type: select
    match: "a.ds-teaser[href], a[class*='ds-teaser'][href]"
    title:
      - { from: self, select: ".ds-teaser__title, [class*='teaser__title']", score: 9 }
      - { from: self, select: "h2, h3", score: 8 }
      - { from: self, recipe: text, score: 5 }
    link: { from: self }
    href_skip:
      - "/direkt/?$"
      - "/foljer/"
      - "/sparade"
      - "/nyhetsbrev/"
      - "/login"
    score: 9
  - type: link_scan
    match: ".ds-teaser a[href]"
    href_must:
      - "/direkt/20\\d{2}-"
    min_length: 18
    title:
      - { from: self, recipe: text, score: 7 }
